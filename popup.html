<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Analytics Debugger</title>
  <style>
    :root {
      --brand: #1F9BF0;
      --off: #c8ccd0;
      --text: #202124;
      --muted: #5f6368;
    }
    * { box-sizing: border-box; }
    body {
      width: 260px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: #fff;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid #eceff1;
    }
    header img { width: 28px; height: 28px; }
    header h1 { font-size: 14px; margin: 0; font-weight: 600; }
    .body { padding: 16px; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .label { font-size: 14px; font-weight: 500; }
    .state { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .state.on { color: var(--brand); font-weight: 600; }

    /* Toggle */
    .switch { position: relative; display: inline-block; width: 46px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background: var(--off); border-radius: 26px; transition: background .2s;
    }
    .slider::before {
      content: ""; position: absolute; height: 20px; width: 20px;
      left: 3px; top: 3px; background: #fff; border-radius: 50%;
      transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3);
    }
    input:checked + .slider { background: var(--brand); }
    input:checked + .slider::before { transform: translateX(20px); }

    .hint { font-size: 11px; color: var(--muted); margin-top: 14px; line-height: 1.5; }
    .hint code { background: #f1f3f4; padding: 1px 4px; border-radius: 3px; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" />
    <h1>Personal Analytics Debugger</h1>
  </header>
  <div class="body">
    <div class="row">
      <div>
        <div class="label">Depuración</div>
        <div class="state" id="state">—</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle" />
        <span class="slider"></span>
      </label>
    </div>
    <p class="hint">
      Cuando está activo, los hits de GA4 se imprimen en la consola
      (<code>DevTools → Console</code>). Recargá la pestaña si el cambio no se refleja.
    </p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
